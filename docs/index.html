<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Note-Taking App</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Auth Container -->
    <div id="authContainer" class="auth-container">
      <div class="auth-card">
        <h1>Note-Taking App</h1>
        
        <!-- Login Form -->
        <div id="loginForm" class="auth-form active">
          <h2>Login</h2>
          <form id="loginFormElement">
            <div class="form-group">
              <label for="loginUsername">Username</label>
              <input type="text" id="loginUsername" placeholder="Enter your username" required>
            </div>
            <div class="form-group">
              <label for="loginPassword">Password</label>
              <input type="password" id="loginPassword" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
          </form>
          <p class="auth-switch">Don't have an account? <a href="#" onclick="switchAuthForm('register'); return false;">Register</a></p>
          <div id="loginError" class="error-message"></div>
        </div>

        <!-- Register Form -->
        <div id="registerForm" class="auth-form">
          <h2>Register</h2>
          <form id="registerFormElement">
            <div class="form-group">
              <label for="registerUsername">Username</label>
              <input type="text" id="registerUsername" placeholder="Choose a username" required>
            </div>
            <div class="form-group">
              <label for="registerEmail">Email</label>
              <input type="email" id="registerEmail" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
              <label for="registerPassword">Password</label>
              <input type="password" id="registerPassword" placeholder="Create a password" required>
            </div>
            <button type="submit" class="btn btn-primary">Register</button>
          </form>
          <p class="auth-switch">Already have an account? <a href="#" onclick="switchAuthForm('login'); return false;">Login</a></p>
          <div id="registerError" class="error-message"></div>
        </div>
      </div>
    </div>

    <!-- Main App Container -->
    <div id="appContainer" class="app-main hidden">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <h1>Notes</h1>
          <button id="logoutBtn" class="btn btn-secondary" title="Logout">Logout</button>
        </div>
        
        <div class="sidebar-user">
          <p>Welcome, <strong id="currentUser">User</strong></p>
        </div>

        <button id="newNoteBtn" class="btn btn-primary btn-full">
          + New Note
        </button>

        <div id="notesList" class="notes-list">
          <!-- Notes will be populated here -->
        </div>
      </aside>

      <!-- Main Content Area -->
      <main class="main-content">
        <!-- Empty State -->
        <div id="emptyState" class="empty-state">
          <div class="empty-state-content">
            <h2>No notes yet</h2>
            <p>Create your first note to get started!</p>
            <button class="btn btn-primary" onclick="createNewNote()">Create Note</button>
          </div>
        </div>

        <!-- Vosk Controls Section -->
        <div id="vosk-controls" class="speech-controls">
          <div class="control-header">
            <h3>🎤 Voice Input (Offline)</h3>
            <span id="vosk-status-indicator" class="status-dot"></span>
          </div>
          
          <div class="model-selector">
            <label for="vosk-model-select">Language Model:</label>
            <select id="vosk-model-select" disabled>
              <option value="">Loading models...</option>
            </select>
            <button id="load-model-btn" disabled>Load Selected Model</button>
          </div>
          
          <div class="recognition-controls">
            <button id="vosk-mic-btn" type="button" disabled title="Load a model first">
              <span class="btn-icon">🎤</span>
              <span class="btn-text">Start Recording</span>
            </button>
          </div>
          
          <div id="vosk-status" class="status-message"></div>
          <div id="vosk-partial" class="partial-result"></div>
        </div>

        <!-- Editor -->
        <div id="editor" class="editor hidden">
          <div class="editor-header">
            <input 
              type="text" 
              id="noteTitle" 
              class="note-title-input" 
              placeholder="Note Title" 
              maxlength="255"
            >
            <div class="editor-actions">
              <button id="saveBtn" class="btn btn-primary">Save</button>
              <button id="deleteBtn" class="btn btn-danger">Delete</button>
              <button id="cancelBtn" class="btn btn-secondary">Cancel</button>
            </div>
          </div>
          
          <div class="editor-body">
            <!-- Rich Text Formatting Toolbar -->
            <div class="editor-toolbar">
              <button type="button" class="format-btn" data-command="bold" title="Bold (Ctrl+B)">B</button>
              <button type="button" class="format-btn" data-command="italic" title="Italic (Ctrl+I)">I</button>
              <button type="button" class="format-btn" data-command="underline" title="Underline (Ctrl+U)">U</button>
              <div class="toolbar-divider"></div>
              <button type="button" class="format-btn" data-command="formatBlock" data-value="h1" title="Heading 1">H1</button>
              <button type="button" class="format-btn" data-command="formatBlock" data-value="h2" title="Heading 2">H2</button>
              <button type="button" class="format-btn" data-command="formatBlock" data-value="h3" title="Heading 3">H3</button>
              <button type="button" class="format-btn" data-command="formatBlock" data-value="p" title="Paragraph">P</button>
              <div class="toolbar-divider"></div>
              <button type="button" class="format-btn" data-command="insertUnorderedList" title="Bullet List">• List</button>
              <button type="button" class="format-btn" data-command="insertOrderedList" title="Numbered List">1. List</button>
              <div class="toolbar-divider"></div>
              <button type="button" class="format-btn" data-command="createLink" title="Add Link">Link</button>
              <button type="button" class="format-btn" data-command="undo" title="Undo">↶</button>
              <button type="button" class="format-btn" data-command="redo" title="Redo">↷</button>
            </div>
            
            <!-- Rich Text Editor Area -->
            <div 
              id="noteContent" 
              class="note-content-input" 
              contenteditable="true" 
              data-placeholder="Start typing your note..."
              role="textbox"
              aria-label="Note content"
            ></div>
            
            <div class="char-count">
              <span id="charCounter">0</span> / 10000 characters
            </div>
            
            <div id="noteError" class="error-message"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Scripts -->
  <script defer src="https://cdn.jsdelivr.net/npm/vosk-browser@0.0.8/dist/vosk.js"></script>
  <script defer src="js/vosk-handler.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
